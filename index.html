<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>備忘錄看板</title>

<!-- ============================================================
     App / Kiosk 模式設定
     在 Chrome 用「加到主畫面」後，會以全螢幕、無網址列的方式開啟。
     ============================================================ -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F1ECE0">
<link rel="manifest" id="manifestLink">
<script>
  // 用 data: URI 內嵌 manifest，這樣不需要另外一個檔案
   const manifest = { name: "備忘錄看板", short_name: "備忘錄", start_url: location.pathname + "#banner", display: "fullscreen", orientation: "landscape", background_color: "#F1ECE0", theme_color: "#F1ECE0", icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23A8402F'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }] }; document.getElementById('manifestLink').setAttribute( 'href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)) );
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F1ECE0; --paper-raised: #FBF8F1; --ink: #26241F; --ink-soft: #6B6558;
    --rule: #D9D2BF; --stamp: #A8402F; --stamp-soft: #A8402F1A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; height: 100%; }
  body { min-height: 100vh; }
  [hidden] { display: none !important; }

  /* ---------- 一般編輯畫面（手機用，新增備忘錄/代辦） ---------- */
  #normalRoot { max-width: 640px; margin: 0 auto; padding: 24px 20px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 600; margin: 0; }
  .status { font-size: 12.5px; color: var(--ink-soft); }
  .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--rule); margin-right:5px; }
  .status-dot.live { background: var(--stamp); }
  .banner-link { display:block; text-align:center; text-decoration:none; font-size:12.5px; font-weight:600;
    color: var(--ink-soft); border:1px dashed var(--rule); border-radius:8px; padding:8px 0; margin-bottom:18px; }
  .tabs { display:flex; gap:20px; margin-bottom:18px; border-bottom:1px solid var(--rule); }
  .tab-btn { font-family:'Lora',serif; font-weight:600; font-size:15px; background:none; border:none;
    color:var(--ink-soft); padding:6px 2px 10px; cursor:pointer; position:relative; }
  .tab-btn.active { color:var(--ink); }
  .tab-btn.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--stamp); }
  .composer { background:var(--paper-raised); border:1px solid var(--rule); border-radius:10px; padding:12px 12px 10px; margin-bottom:16px; }
  .composer textarea { width:100%; border:none; background:transparent; font-family:'Inter',sans-serif; font-size:16px;
    resize:none; outline:none; min-height:44px; }
  .composer-row { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:6px; }
  .date-input { font-size:13px; background:var(--paper); border:1px solid var(--rule); border-radius:7px; padding:7px 8px; margin-right:auto; }
  .add-btn { font-weight:600; font-size:14px; color:var(--paper-raised); background:var(--ink); border:none;
    border-radius:7px; padding:8px 16px; cursor:pointer; }
  .add-btn:disabled { opacity:.35; }
  .segmented { display:flex; gap:6px; margin-bottom:14px; }
  .seg-btn { flex:1; text-align:center; font-size:13px; font-weight:600; padding:8px 0; border-radius:7px;
    border:1px solid var(--rule); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; }
  .seg-btn.active { background:var(--ink); color:var(--paper-raised); border-color:var(--ink); }
  .list { display:flex; flex-direction:column; gap:10px; }
  .item { position:relative; background:var(--paper-raised); border:1px solid var(--rule); border-left:3px solid var(--stamp);
    border-radius:8px; padding:12px 40px 12px 14px; }
  .item-text { font-size:15.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; margin:0 0 5px; }
  .item-meta { font-size:12.5px; color:var(--ink-soft); font-family:'Lora',serif; font-style:italic; }
  .del-btn { position:absolute; top:10px; right:10px; width:24px; height:24px; border:none; background:transparent;
    color:var(--ink-soft); font-size:17px; cursor:pointer; border-radius:5px; }
  .del-btn:hover { color:var(--stamp); background:var(--stamp-soft); }
  .todo-row { display:flex; align-items:flex-start; gap:10px; }
  .checkbox { width:21px; height:21px; border-radius:5px; border:1.5px solid var(--ink-soft); background:transparent;
    flex-shrink:0; cursor:pointer; color:transparent; font-size:14px; padding:0; }
  .checkbox.checked { background:var(--stamp); border-color:var(--stamp); color:var(--paper-raised); }
  .done-text { text-decoration:line-through; color:var(--ink-soft); }
  .empty { text-align:center; color:var(--ink-soft); font-family:'Lora',serif; font-style:italic; font-size:15px; padding:50px 20px; }
  .setup-warning { background:#fff3cd; border:1px solid #e0c46c; color:#5a4a12; font-size:13px; padding:10px 12px;
    border-radius:8px; margin-bottom:16px; line-height:1.6; }

  /* ---------- 橫幅看板模式：備忘錄 | 行事曆 | 天氣（給 LD 290EJS 這類超寬短螢幕）---------- */
  #bannerRoot { position:fixed; inset:0; display:flex; background:var(--paper); color:var(--ink); }
  .b-col { padding: 2.6vh 2vw; display:flex; flex-direction:column; overflow:hidden; }
  .b-col + .b-col { border-left:1px solid var(--rule); }
  .b-title { font-family:'Lora',serif; font-weight:600; font-size:2vh; margin-bottom:1.2vh; padding-bottom:0.9vh;
    border-bottom:1px solid var(--rule); flex-shrink:0; }
  .b-memo { flex: 0 0 30vw; }
  .b-calendar { flex: 0 0 42vw; }
  .b-weather { flex: 1; }
  .b-list { flex:1; overflow:hidden; display:flex; flex-direction:column; gap:1vh; }
  .b-row { display:flex; gap:0.8vw; font-size:2.1vh; line-height:1.3; }
  .b-row-done { opacity:.4; text-decoration:line-through; }
  .b-row .mark { width:1.2vh; height:1.2vh; border-radius:50%; background:var(--stamp); flex-shrink:0; margin-top:0.8vh; }
  .b-empty { color:var(--ink-soft); font-family:'Lora',serif; font-style:italic; font-size:1.8vh; }
  .b-calendar iframe { flex:1; width:100%; border:none; border-radius:8px; background:#fff; }
  .b-weather-now { display:flex; align-items:baseline; gap:1vw; margin-bottom:1.5vh; }
  .b-weather-temp { font-family:'Lora',serif; font-weight:600; font-size:8vh; line-height:1; }
  .b-weather-desc { font-size:2vh; color:var(--ink-soft); }
  .b-weather-days { display:flex; flex-direction:column; gap:0.8vh; }
  .b-weather-day-row { display:flex; justify-content:space-between; font-size:1.9vh; }
  .banner-exit { position:absolute; top:10px; right:12px; font-size:11px; color:var(--ink-soft); background:var(--paper-raised);
    border:1px solid var(--rule); border-radius:6px; padding:4px 8px; cursor:pointer; opacity:.5; }
  .banner-exit:hover { opacity:1; }
  .b-clock { font-family:'Lora',serif; font-style:italic; font-size:1.6vh; color:var(--ink-soft); }
</style>
</head>
<body>

<!-- ================= 一般編輯畫面 ================= -->
<div id="normalRoot">
  <header>
    <h1>備忘錄</h1>
    <span class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">連線中…</span></span>
  </header>

  <a class="banner-link" id="openBannerBtn" href="#banner" target="_blank" rel="noopener">開啟橫幅顯示模式 ↗</a>

  <div class="setup-warning" id="setupWarning" hidden></div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="memo">備忘錄</button>
    <button class="tab-btn" data-tab="todo">代辦事項</button>
  </nav>

  <section id="memoSection">
    <div class="composer">
      <textarea id="memoInput" placeholder="寫下這一刻想記住的事…" rows="1"></textarea>
      <div class="composer-row"><button class="add-btn" id="memoAddBtn" disabled>新增</button></div>
    </div>
    <div class="list" id="memoList"></div>
  </section>

  <section id="todoSection" hidden>
    <div class="composer">
      <textarea id="todoInput" placeholder="要做的事…" rows="1"></textarea>
      <div class="composer-row">
        <input type="date" id="todoDateInput" class="date-input">
        <button class="add-btn" id="todoAddBtn" disabled>新增</button>
      </div>
    </div>
    <div class="segmented">
      <button class="seg-btn active" data-view="date">依日期</button>
      <button class="seg-btn" data-view="unfinished">未完成</button>
    </div>
    <div class="list" id="todoList"></div>
  </section>
</div>

<!-- ================= 橫幅看板模式 ================= -->
<div id="bannerRoot" hidden>
  <button class="banner-exit" id="bannerExitBtn" type="button">離開橫幅模式</button>

   <div class="b-col b-memo"> <div class="b-title">備忘錄</div> <div class="b-list" id="bMemoList"></div> </div> <div class="b-col b-todo"> <div class="b-title">今日代辦</div> <div class="b-list" id="bTodoList"></div> </div> <div class="b-col b-calendar">
  </div>

  <div class="b-col b-calendar">
    <div class="b-title" style="display:flex; justify-content:space-between;">
      <span>行事曆</span><span class="b-clock" id="bClock"></span>
    </div>
    <iframe id="calendarFrame" src="" loading="lazy"></iframe>
  </div>

  <div class="b-col b-weather">
    <div class="b-title">天氣 · <span id="weatherPlace">—</span></div>
    <div id="weatherBody">
      <div class="b-empty">讀取中…</div>
    </div>
  </div>
</div>

<script type="module">
/* =====================================================================
   設定區：請在部署前，把下面幾個值換成你自己的
   ===================================================================== */

// 1) Firebase 專案設定（Firebase 主控台 → 專案設定 → 一般 → 你的應用程式 → SDK 設定與配置）
const firebaseConfig = {
  apiKey: "AIzaSyDCC7MNUdCIzzBrQgwgKm4GW7iBt7QAWEE", authDomain: "pmweb-b07e6.firebaseapp.com", projectId: "pmweb-b07e6", storageBucket: "pmweb-b07e6.firebasestorage.app", messagingSenderId: "815602437191", appId: "1:815602437191:web:10a8276ed4264d51e37562", measurementId: "G-YXSCNCT48Z"
};
  

// 2) Google 行事曆：日曆設定 → 「與特定使用者共用」下方的「垃圾整合」or「公開」→ 複製「行事曆 ID」
//    （通常長得像 xxxxxxxx@group.calendar.google.com，或你自己的 gmail 位址）
const GOOGLE_CALENDAR_ID = "b68dfc491bd8de7a3b7b116aa8dfa5946c7f20342ac68de86e1bf388365151aa@group.calendar.google.com";

// 3) 天氣位置（緯度、經度）。預設先填台北，請自行改成螢幕安裝的地點。
const WEATHER_LAT = 25.033;
const WEATHER_LON = 121.565;
const WEATHER_PLACE_NAME = "台北";

const FIREBASE_NOT_CONFIGURED = firebaseConfig.apiKey === "YOUR_API_KEY";

/* ===================================================================== */

const $ = (s) => document.querySelector(s);

if (FIREBASE_NOT_CONFIGURED) {
  const w = $('#setupWarning');
  w.hidden = false;
  w.textContent = '⚠️ 尚未設定 Firebase：請打開這個檔案，把最上面的 firebaseConfig 換成你自己 Firebase 專案的設定，備忘錄/代辦事項才能同步。';
}

let db = null, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, limit, updateDoc;

async function initFirebase() {
  if (FIREBASE_NOT_CONFIGURED) return;
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const mod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  ({ collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, limit, updateDoc } = mod);
  const app = initializeApp(firebaseConfig);
  db = mod.getFirestore(app);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const sameDay = d.toDateString() === new Date().toDateString();
  return (sameDay ? '今天 ' : `${d.getMonth()+1}/${d.getDate()} `) + d.toLocaleTimeString('zh-Hant-TW', { hour:'2-digit', minute:'2-digit' });
}
function formatDateTag(dateStr) {
  if (dateStr === todayStr()) return '今天';
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${m}/${d}`;
}
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

/* ---------------- 備忘錄 ---------------- */
let memos = [];
const memoInput = $('#memoInput'), memoAddBtn = $('#memoAddBtn'), memoList = $('#memoList');
memoInput.addEventListener('input', () => {
  memoInput.style.height = 'auto'; memoInput.style.height = Math.min(memoInput.scrollHeight, 200) + 'px';
  memoAddBtn.disabled = !memoInput.value.trim() || !db;
});
memoAddBtn.addEventListener('click', async () => {
  const text = memoInput.value.trim();
  if (!text || !db) return;
  memoInput.value = ''; memoAddBtn.disabled = true;
  await addDoc(collection(db, 'memos'), { text, createdAt: Date.now() });
});
function renderMemos() {
  memoList.innerHTML = memos.length === 0
    ? '<div class="empty">還沒有備忘錄。</div>'
    : memos.map(m => `
      <div class="item" data-id="${m.id}">
        <p class="item-text">${esc(m.text)}</p>
        <div class="item-meta">${formatTime(m.createdAt)}</div>
        <button class="del-btn" data-id="${m.id}">×</button>
      </div>`).join('');
  memoList.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', () => deleteDoc(doc(db, 'memos', b.dataset.id))));
  renderBannerMemos();
}

/* ---------------- 代辦事項 ---------------- */
let todos = [];
let todoView = 'date';
let selectedDate = todayStr();
const todoInput = $('#todoInput'), todoAddBtn = $('#todoAddBtn'), todoList = $('#todoList'), todoDateInput = $('#todoDateInput');
todoDateInput.value = selectedDate;
todoInput.addEventListener('input', () => {
  todoInput.style.height = 'auto'; todoInput.style.height = Math.min(todoInput.scrollHeight, 200) + 'px';
  todoAddBtn.disabled = !todoInput.value.trim() || !db;
});
todoDateInput.addEventListener('change', () => { selectedDate = todoDateInput.value || todayStr(); renderTodos(); });
todoAddBtn.addEventListener('click', async () => {
  const text = todoInput.value.trim();
  if (!text || !db) return;
  const date = todoDateInput.value || todayStr();
  todoInput.value = ''; todoAddBtn.disabled = true;
  await addDoc(collection(db, 'todos'), { text, date, done: false, createdAt: Date.now() });
});
document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => {
  todoView = b.dataset.view;
  document.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('active', x === b));
  renderTodos();
}));
function renderTodos() {
  const items = todoView === 'date'
    ? todos.filter(t => t.date === selectedDate).sort((a,b) => (a.createdAt||0)-(b.createdAt||0))
    : todos.filter(t => !t.done).sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||0)-(b.createdAt||0));
     renderBannerTodos();
  todoList.innerHTML = items.length === 0
    ? `<div class="empty">${todoView === 'date' ? '這天還沒有代辦事項。' : '太好了，沒有未完成的代辦事項。'}</div>`
    : items.map(t => `
      <div class="item todo-row" data-id="${t.id}">
        <button class="checkbox ${t.done ? 'checked':''}" data-id="${t.id}">${t.done ? '✓':''}</button>
        <div>
          <p class="item-text ${t.done?'done-text':''}">${esc(t.text)}</p>
          ${todoView === 'unfinished' ? `<div class="item-meta">${formatDateTag(t.date)}</div>` : ''}
        </div>
        <button class="del-btn" data-id="${t.id}">×</button>
      </div>`).join('');
  todoList.querySelectorAll('.checkbox').forEach(b => b.addEventListener('click', () => {
    const item = todos.find(t => t.id === b.dataset.id);
    updateDoc(doc(db, 'todos', b.dataset.id), { done: !item.done });
  }));
  todoList.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', () => deleteDoc(doc(db, 'todos', b.dataset.id))));
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('active', x === b));
  $('#memoSection').hidden = b.dataset.tab !== 'memo';
  $('#todoSection').hidden = b.dataset.tab !== 'todo';
}));
 /* ---------------- 樫幅看板：代辦事項欄（只顯示今天的） ---------------- */ function renderBannerTodos() { const el = $('#bTodoList'); if (!el) return; const t = todayStr(); const shown = todos .filter(x => x.date === t) .sort((a, b) => (a.done !== b.done) ? (a.done ? 1 : -1) : (a.createdAt || 0) - (b.createdAt || 0)) .slice(0, 8); el.innerHTML = shown.length === 0 ? '<div class="b-empty">今天還沒有代辦事項</div>' : shown.map(x => `<div class="b-row ${x.done ? 'b-row-done' : ''}"><span class="mark"></span><span>${esc(x.text)}</span></div>`).join(''); }
/* ---------------- 橫幅看板：備忘錄欄 ---------------- */
function renderBannerMemos() {
  const el = $('#bMemoList');
  if (!el) return;
  const shown = memos.slice(0, 8);
  el.innerHTML = shown.length === 0
    ? '<div class="b-empty">還沒有備忘錄</div>'
    : shown.map(m => `<div class="b-row"><span class="mark"></span><span>${esc(m.text)}</span></div>`).join('');
}

/* ---------------- 橫幅看板：行事曆欄 ---------------- */
function initCalendar() {
  const frame = $('#calendarFrame');
  if (!GOOGLE_CALENDAR_ID || GOOGLE_CALENDAR_ID.startsWith('YOUR_')) {
    frame.replaceWith(Object.assign(document.createElement('div'), {
      className: 'b-empty',
      textContent: '尚未設定 Google 行事曆 ID（見程式碼最上方設定區）'
    }));
    return;
  }
  const params = new URLSearchParams({
    src: GOOGLE_CALENDAR_ID, ctz: 'Asia/Taipei', mode: 'AGENDA',
    showTitle: '0', showPrint: '0', showTabs: '0', showCalendars: '0', showTz: '0'
  });
  frame.src = `https://calendar.google.com/calendar/embed?${params.toString()}`;
}
function tickClock() {
  const el = $('#bClock');
  if (el) el.textContent = new Date().toLocaleTimeString('zh-Hant-TW', { hour: '2-digit', minute: '2-digit' });
}

/* ---------------- 橫幅看板：天氣欄（Open-Meteo，免金鑰） ---------------- */
const WEATHER_CODE_MAP = {
  0: '晴朗', 1: '大致晴朗', 2: '多雲', 3: '陰天', 45: '起霧', 48: '霧淞',
  51: '毛毛雨', 53: '毛毛雨', 55: '毛毛雨', 61: '小雨', 63: '中雨', 65: '大雨',
  71: '小雪', 73: '中雪', 75: '大雪', 80: '陣雨', 81: '陣雨', 82: '強陣雨',
  95: '雷雨', 96: '雷雨挾冰雹', 99: '雷雨挾冰雹'
};
async function loadWeather() {
  $('#weatherPlace').textContent = WEATHER_PLACE_NAME;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=4`;
    const res = await fetch(url);
    const data = await res.json();
    const cur = data.current;
    const daily = data.daily;
    const desc = WEATHER_CODE_MAP[cur.weather_code] || '—';
    const weekday = ['日','一','二','三'];
    let rows = '';
    for (let i = 1; i < daily.time.length; i++) {
      const d = new Date(daily.time[i]);
      rows += `<div class="b-weather-day-row"><span>週${weekday[d.getDay()] || d.getDay()}</span>
        <span>${WEATHER_CODE_MAP[daily.weather_code[i]] || ''}</span>
        <span>${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°</span></div>`;
    }
    $('#weatherBody').innerHTML = `
      <div class="b-weather-now">
        <div class="b-weather-temp">${Math.round(cur.temperature_2m)}°</div>
        <div class="b-weather-desc">${desc}</div>
      </div>
      <div class="b-weather-days">${rows}</div>`;
  } catch (e) {
    $('#weatherBody').innerHTML = '<div class="b-empty">天氣資料讀取失敗</div>';
  }
}

/* ---------------- 橫幅模式切換（用 #banner，靜態網頁環境最穩定） ---------------- */
const isBannerMode = location.hash === '#banner';
$('#openBannerBtn').href = location.pathname + location.search + '#banner';
$('#bannerExitBtn').addEventListener('click', () => { location.hash = ''; location.reload(); });

/* ---------------- 啟動 ---------------- */
async function init() {
  renderMemos(); renderTodos();

  if (isBannerMode) {
    $('#normalRoot').hidden = true;
    $('#bannerRoot').hidden = false;
    initCalendar();
    tickClock(); setInterval(tickClock, 30000);
    loadWeather(); setInterval(loadWeather, 15 * 60 * 1000); // 每 15 分鐘更新一次
  }

  await initFirebase();
  if (!db) {
    $('#statusText').textContent = '尚未設定資料庫';
    memoInput.disabled = true; todoInput.disabled = true;
    return;
  }
  onSnapshot(query(collection(db, 'memos'), orderBy('createdAt', 'desc'), limit(300)), (snap) => {
    memos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    $('#statusDot').classList.add('live'); $('#statusText').textContent = `${memos.length} 則`;
    renderMemos();
  });
  onSnapshot(query(collection(db, 'todos'), orderBy('createdAt', 'desc'), limit(500)), (snap) => {
    todos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTodos();
  });
  memoAddBtn.disabled = !memoInput.value.trim();
  todoAddBtn.disabled = !todoInput.value.trim();
}
init();
</script>
</body>
</html>
